<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteos JP</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
color:#44245f;
min-height:100vh;
background:linear-gradient(135deg,#ead7ff,#c59aff,#f4d5ff,#b987ed);
overflow-x:hidden;
}

.mariposa{
position:fixed;
z-index:0;
font-size:45px;
filter:drop-shadow(0 0 6px white) drop-shadow(0 0 15px #eaa7ff) drop-shadow(0 0 25px #c66cff);
animation:volar 5s ease-in-out infinite;
}

.m1{top:8%;left:5%}
.m2{top:22%;right:6%;animation-delay:1s}
.m3{top:48%;left:3%;font-size:35px;animation-delay:2s}
.m4{top:67%;right:5%;animation-delay:3s}
.m5{top:86%;left:12%;font-size:35px;animation-delay:1.5s}

@keyframes volar{
0%,100%{transform:translateY(0) rotate(-5deg) scale(1)}
50%{transform:translateY(-18px) rotate(7deg) scale(1.1)}
}

.brillo{
position:fixed;
color:white;
font-size:28px;
z-index:0;
text-shadow:0 0 6px white,0 0 15px #f0aaff,0 0 25px #bd65ff;
animation:brillar 2s infinite alternate;
}

.b1{top:12%;left:25%}
.b2{top:30%;right:25%;animation-delay:.5s}
.b3{top:55%;left:20%;animation-delay:1s}
.b4{top:78%;right:20%;animation-delay:1.5s}

@keyframes brillar{
from{opacity:.3;transform:scale(.8)}
to{opacity:1;transform:scale(1.3)}
}
