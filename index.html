<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteos JP</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#3d2850;
  background:
    radial-gradient(circle at 10% 10%, #ffffffaa 0 5%, transparent 6%),
    linear-gradient(135deg,#eadcff,#cda7ff,#f1e5ff,#b985ed);
  min-height:100vh;
}

body::before{
  content:"🦋  ✨  🦋  ✨  🦋";
  position:fixed;
  top:20px;
  left:0;
  width:100%;
  text-align:center;
  font-size:25px;
  opacity:.65;
  pointer-events:none;
}

header{
  text-align:center;
  padding:55px 15px 30px;
  background:linear-gradient(135deg,#6e32a8,#a85de0,#d7b4ff);
  color:white;
  border-radius:0 0 35px 35px;
  box-shadow:0 5px 20px #5b287755;
}

header h1{
  margin:0;
  font-size:36px;
  text-shadow:0 3px 5px #4b216b88;
}

header p{
  margin:10px 0 0;
  font-size:19px;
}

.container{
  width:92%;
  max-width:850px;
  margin:25px auto;
}

.card{
  background:#ffffffee;
  border:2px solid #e2c8ff;
  border-radius:25px;
  padding:22px;
  margin-bottom:22px;
  box-shadow:0 8px 25px #6c3b8833;
}

.card h2{
  margin-top:0;
  color:#7134a4;
